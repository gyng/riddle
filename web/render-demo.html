<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Riddle — render demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0a0c; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 8px env(safe-area-inset-right, 8px) calc(8px + env(safe-area-inset-bottom, 0px)) 8px;
             font: 12px/1 ui-monospace, monospace; }
      #bar button { flex: 0 0 auto; background: #1d1a20; color: #d9c9a1; border: 1px solid #4a4046; padding: 8px 12px; min-width: 44px; }
      #bar button.on { background: #d9c9a1; color: #14110d; }
      #hud { position: fixed; left: 8px; top: calc(6px + env(safe-area-inset-top, 0px)); color: #d9c9a1; font: 11px/1.3 ui-monospace, monospace; opacity: 0.8; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="hud"></div>
    <div id="bar">
      <button data-speed="0">||</button>
      <button data-speed="1">1x</button>
      <button data-speed="4">4x</button>
      <button id="skip">skip</button>
    </div>
    <script type="module" src="/src/render/demo.ts"></script>
  </body>
</html>
